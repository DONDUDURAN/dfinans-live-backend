version: '3.8'
services:
  backend:
    build: .
    ports:
      - "5055:5055"
    environment:
      - PORT=5055
      - BINANCE_LIVE_API_KEY=${BINANCE_LIVE_API_KEY}
      - BINANCE_LIVE_SECRET_KEY=${BINANCE_LIVE_SECRET_KEY}
      - IBKR_ENABLED=true
      - IBKR_FORCE_DISABLED=false
      - IBKR_HOST=ibkr-gateway
      - IBKR_PORT=4003
      - IBKR_CLIENT_ID=21
      - IBKR_LIVE_TRADING=true
      - AUTO_TRADER_ENABLED=true
      - AUTO_TRADER_MODE=live
    depends_on:
      - ibkr-gateway
    networks:
      - dfinans-net

  ibkr-gateway:
    build:
      context: .
      dockerfile: ibkr-gateway-image/Dockerfile
    ports:
      - "4003:4003"
    environment:
      - TWS_USERID=${IBKR_USERID:-demo}
      - TWS_PASSWORD=${IBKR_PASSWORD:-demopass}
      - TWS_ACCOUNT=${IBKR_ACCOUNT:-}
      - ISERVER_ACCOUNT=${IBKR_ACCOUNT:-}
      - IBC_MODE=gateway
      - IBC_GATEWAY=true
      - IBC_FIX_USESSL=false
      - IBC_FIX_SOCKETPORT=4003
    networks:
      - dfinans-net
    # IBKR Gateway (ib-gateway-docker) - accepts API connections on 4003

networks:
  dfinans-net:
    driver: bridge
