version: '3.8'
services:
  backend:
    build: .
    ports:
      - "5055:5055"
    environment:
      - PORT=5055
      - BINANCE_LIVE_API_KEY=${BINANCE_LIVE_API_KEY}
      - BINANCE_LIVE_SECRET_KEY=${BINANCE_LIVE_SECRET_KEY}
      - IBKR_ENABLED=true
      - IBKR_FORCE_DISABLED=false
      - IBKR_HOST=ibkr-gateway
      - IBKR_PORT=4001
      - IBKR_CLIENT_ID=21
      - IBKR_LIVE_TRADING=true
      - AUTO_TRADER_ENABLED=true
      - AUTO_TRADER_MODE=live
    depends_on:
      - ibkr-gateway
    networks:
      - dfinans-net

  ibkr-gateway:
    build:
      context: .
      dockerfile: ibgateway.Dockerfile
    ports:
      - "4001:4001"
    environment:
      - TWSUSER=${IBKR_USERID:-demo}
      - TWSPASS=${IBKR_PASSWORD:-demopass}
      - TRADING_MODE=live
    networks:
      - dfinans-net
    # IBKR Gateway (waytrade/ibkr-gateway) - accepts API connections on 4001

networks:
  dfinans-net:
    driver: bridge
