name: Build ibkr-gateway custom image

on:
  push:
    paths:
      - "ibgateway.Dockerfile"
      - "ibkr-gateway-image/**"
      - ".github/workflows/build-ibkr-gateway-image.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image tag
        id: vars
        run: echo "tag=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/ibkr-gateway-custom:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ibgateway.Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tag }}
